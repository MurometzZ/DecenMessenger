[package]
name = "decen_messenger"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
eframe = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
